apiVersion: v1
kind: Secret
metadata:
  name: chronos-secrets
type: Opaque
data:
  # BUG FIX: this previously read .Values.env.CHRONOS_API_KEY, but both
  # values-bank.yaml and values-advanced.yaml define the key under
  # env.API_KEY, not env.CHRONOS_API_KEY — the mismatch meant `api-key`
  # rendered as an empty/null secret value on every deploy. Also added
  # jwt-key, which was missing entirely: Config.validate() requires
  # JWT_SECRET to be explicitly set and different from SECRET_KEY in
  # production, so without this the app either fails Config.validate()
  # on boot or (pre-fix) silently reused SECRET_KEY as JWT_SECRET.
  api-key: {{ .Values.env.API_KEY | b64enc }}
  nibss-key: {{ .Values.env.NIBSS_API_KEY | b64enc }}
  secret-key: {{ .Values.env.SECRET_KEY | b64enc }}
  jwt-key: {{ .Values.env.JWT_SECRET | b64enc }}
