apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chronos.fullname" . }}
  labels:
    app: {{ include "chronos.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "chronos.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "chronos.name" . }}
    spec:
      volumes:
        - name: chronos-secrets
          secret:
            secretName: chronos-secrets
            defaultMode: 0400
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: chronos-secrets
              mountPath: /run/secrets
              readOnly: true
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}/{{ .Values.postgres.database }}"
            - name: REDIS_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
            - name: CELERY_BROKER_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/2"
            - name: CHRONOS_API_KEY_FILE
              value: /run/secrets/api-key
            - name: SECRET_KEY_FILE
              value: /run/secrets/secret-key
            - name: JWT_SECRET_FILE
              value: /run/secrets/jwt-key
            - name: NIBSS_API_KEY_FILE
              value: /run/secrets/nibss-key
            {{- range $key, $val := .Values.env }}
            {{- if not (has $key (list "API_KEY" "SECRET_KEY" "JWT_SECRET" "NIBSS_API_KEY")) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
