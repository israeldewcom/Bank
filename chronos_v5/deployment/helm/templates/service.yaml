apiVersion: v1
kind: Service
metadata:
  name: {{ include "chronos.fullname" . }}
  labels:
    app: {{ include "chronos.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # BUG FIX: targetPort was hardcoded to 5000, which never matched the
    # container's actual listening port (8000, per the Dockerfile CMD).
    # Traffic routed through this Service would have failed to reach the
    # pod at all. Now points at the same 8000 the container exposes.
    - port: {{ .Values.service.port }}
      targetPort: 8000
  selector:
    app: {{ include "chronos.name" . }}
