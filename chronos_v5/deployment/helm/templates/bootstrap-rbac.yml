apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronos-bootstrap
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chronos-bootstrap-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chronos-bootstrap-secrets-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: chronos-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: chronos-bootstrap-secrets
  apiGroup: rbac.authorization.k8s.io
