version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: chronos
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ${DB_BACKUP_PATH:-./backups}:/backups
    ports:
      - "5432:5432"
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chronos-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chronos:${POSTGRES_PASSWORD}@postgres:5432/chronos
      REDIS_URL: redis://redis:6379/0
      CHRONOS_ENV: production
      CHRONOS_API_KEY_FILE: /run/secrets/api_key
      SECRET_KEY_FILE: /run/secrets/secret_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      NIBSS_API_KEY_FILE: /run/secrets/nibss_key
      ASYNC_DB: "true"
      DB_BACKUP_ENABLED: "true"
      DB_BACKUP_PATH: "/backups"
      ADVANCED_FEATURES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./historical_data:/app
      - ${DB_BACKUP_PATH:-./backups}:/backups
    secrets:
      - api_key
      - secret_key
      - jwt_secret
      - nibss_key
    user: "1001:1001"

  chronos-celery:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A chronos_v5.celery_app worker --loglevel=info -Q celery,alpha,risk,rehypo,advanced
    environment:
      DATABASE_URL: postgresql://chronos:${POSTGRES_PASSWORD}@postgres:5432/chronos
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY_FILE: /run/secrets/secret_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    depends_on:
      - redis
      - postgres
    volumes:
      - ./models:/app/models
    secrets:
      - secret_key
      - jwt_secret
    user: "1001:1001"

  chronos-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A chronos_v5.celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis
    user: "1001:1001"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  api_key:
    file: ./secrets/api_key.txt
  secret_key:
    file: ./secrets/secret_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  nibss_key:
    file: ./secrets/nibss_key.txt

volumes:
  pg_data:
  redis_data:
